services:
  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    volumes:
      - ps-db:/var/lib/mysql   # persist DB so data survives restarts

  prestashop:
    image: prestashop/prestashop:8
    depends_on:
      - mysql
    ports:
      - "8080:80"              # FIXED port — always localhost:8080
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_INSTALL_AUTO: 1
      PS_ERASE_DB: 0           # don't wipe on restart
      PS_DEV_MODE: 1
      PS_DOMAIN: localhost:8080
      PS_HANDLE_DYNAMIC_DOMAIN: 0   # fixed domain now, no need for dynamic
      ADMIN_MAIL: admin@prestakit.test
      ADMIN_PASSWD: PrestaKit123
    volumes:
      - ps-app:/var/www/html   # persist PrestaShop files

volumes:
  ps-db:
  ps-app: