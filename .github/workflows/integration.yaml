name: Integration Tests

on:
  workflow_dispatch:             
  schedule:
    - cron: '0 2 * * 1'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/PrestaKit.IntegrationTests/PrestaKit.IntegrationTests.csproj --no-build -c Release